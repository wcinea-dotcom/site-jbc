  to     = "/en/dossier-jbc-en.html"
  status = 301
[[redirects]]
  from   = "/en/dossier-jbc-ht.html"
  to     = "/en/dossier-jbc-en.html"
  status = 301
[[redirects]]
  from   = "/ht/dossier-jbc-fr.html"
  to     = "/ht/dossier-jbc-ht.html"
  status = 301
[[redirects]]
  from   = "/ht/dossier-jbc-en.html"
  to     = "/ht/dossier-jbc-ht.html"
  status = 301
[[redirects]]
  from   = "/dossier-jbc-en.html"
  to     = "/dossier-jbc-fr.html"
  status = 301
[[redirects]]
  from   = "/dossier-jbc-ht.html"
  to     = "/dossier-jbc-fr.html"
  status = 301

# ─── SOS Pétition ───
[[redirects]]
