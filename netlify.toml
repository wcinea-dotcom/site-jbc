  to     = "/en/sos-petition-en.html"
  status = 301
[[redirects]]
  from   = "/ht/sos-petition-fr.html"
  to     = "/ht/sos-petition-ht.html"
  status = 301
[[redirects]]
  from   = "/ht/sos-petition-en.html"
  to     = "/ht/sos-petition-ht.html"
  status = 301
[[redirects]]
  from   = "/sos-petition-en.html"
  to     = "/sos-petition-fr.html"
  status = 301
[[redirects]]
  from   = "/sos-petition-ht.html"
  to     = "/sos-petition-fr.html"
  status = 301

# ─── Conférence ───
[[redirects]]
  from   = "/en/conference-fr.html"
  to     = "/en/conference-en.html"
  status = 301
[[redirects]]
  from   = "/en/conference-ht.html"
  to     = "/en/conference-en.html"
  status = 301
[[redirects]]
  from   = "/ht/conference-fr.html"
  to     = "/ht/conference-ht.html"
  status = 301
[[redirects]]
  from   = "/ht/conference-en.html"
