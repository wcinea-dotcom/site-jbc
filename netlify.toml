# =========================================================
#  netlify.toml — Jardin Botanique des Cayes
#  Deployment config for Netlify (jardinbotaniquecayeshaiti.org)
#
#  NOTE: _config.yml keeps baseurl: "/site-jbc" for GitHub Pages.
#  Here we override baseurl to "" so all paths resolve from root.
# =========================================================

[build]
  command   = "jekyll build --baseurl ''"
  publish   = "_site"

[build.environment]
  JEKYLL_ENV   = "production"
  RUBY_VERSION = "3.4"

# =========================================================
#  PÉTITION → page « Merci » (Phase 2)
#  La pétition s'est terminée le 5 juin. L'ancien lien partagé
#  redirige vers /merci (où l'on peut toujours signer — même
#  formulaire/Sheet). Fichier de pétition non modifié, RÉVERSIBLE.
# =========================================================
[[redirects]]
  from = "/sos-petition-fr"
  to = "/merci"
  status = 301
  force = true
[[redirects]]
  from = "/sos-petition-fr.html"
  to = "/merci"
  status = 301
  force = true
[[redirects]]
  from = "/en/sos-petition-en"
  to = "/en/merci"
  status = 301
  force = true
[[redirects]]
  from = "/en/sos-petition-en.html"
  to = "/en/merci"
  status = 301
  force = true
[[redirects]]
  from = "/ht/sos-petition-ht"
  to = "/ht/merci"
  status = 301
  force = true
[[redirects]]
  from = "/ht/sos-petition-ht.html"
  to = "/ht/merci"
  status = 301
  force = true

# Redirect bare domain to www (optional — remove if not needed)
# [[redirects]]
#   from   = "https://www.jardinbotaniquecayeshaiti.org/*"
#   to     = "https://jardinbotaniquecayeshaiti.org/:splat"
#   status = 301

# =========================================================
#  Redirections cross-langue pour pages à nom spécifique
#  (dossier-jbc, sos-petition, conference) — évite les 404
#  quand quelqu'un partage un mauvais lien.
# =========================================================

# ─── Dossier "En savoir plus" ───
[[redirects]]
