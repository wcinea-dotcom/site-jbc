# Custom 404 pages — language-specific (order matters: specific first)
[[redirects]]
  from   = "/en/*"
  to     = "/en/404.html"
  status = 404

[[redirects]]
  from   = "/ht/*"
  to     = "/ht/404.html"
  status = 404

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
