
<script>
(function () {
  'use strict';

  /* ── Attendre que le DOM soit prêt ─────────────────────────────── */
  function ready(fn) {
    if (document.readyState !== 'loading') { fn(); }
    else { document.addEventListener('DOMContentLoaded', fn); }
  }

  ready(function () {

    /* ── Éléments ───────────────────────────────────────────────── */
    var burger  = document.getElementById('burger');
    var mainNav = document.getElementById('main-nav');

    /* Sécurité : on arrête si les éléments n'existent pas */
    if (!burger || !mainNav) { return; }

    /* ── 1. Ouvrir / fermer le menu mobile ──────────────────────── */
    burger.setAttribute('aria-expanded', 'false');

    burger.addEventListener('click', function (e) {
      e.stopPropagation();
      var isOpen = mainNav.classList.toggle('nav-open');
      burger.setAttribute('aria-expanded', String(isOpen));
      /* Bloquer le scroll du body quand le menu est ouvert */
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    /* ── 2. Fermer en cliquant en dehors du menu ─────────────────── */
    document.addEventListener('click', function (e) {
      if (
        mainNav.classList.contains('nav-open') &&
        !mainNav.contains(e.target) &&
        !burger.contains(e.target)
      ) {
        closeMenu();
      }
    });

    /* ── 3. Fermer avec la touche Échap ─────────────────────────── */
    document.addEventListener('keydown', function (e) {
      if ((e.key === 'Escape' || e.key === 'Esc') &&
           mainNav.classList.contains('nav-open')) {
        closeMenu();
        burger.focus(); /* remettre le focus sur le bouton */
      }
    });

    /* ── 4. Fermer en cliquant sur un lien du menu (mobile) ──────── */
    mainNav.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        if (window.innerWidth <= 900) { closeMenu(); }
      });
    });

    /* ── 5. Dropdowns (chevrons Accueil / Nature) ────────────────── */
    document.querySelectorAll('.drop').forEach(function (drop) {
      var btn  = drop.querySelector('button');
      var menu = drop.querySelector('.menu');
      if (!btn || !menu) { return; }

      btn.setAttribute('aria-expanded', 'false');

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = drop.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', String(open));
        /* Fermer les autres dropdowns */
        document.querySelectorAll('.drop').forEach(function (other) {
          if (other !== drop) {
            other.classList.remove('is-open');
            var otherBtn = other.querySelector('button');
            if (otherBtn) { otherBtn.setAttribute('aria-expanded', 'false'); }
          }
        });
      });
    });

    /* ── 6. Fermer les dropdowns en cliquant ailleurs ────────────── */
    document.addEventListener('click', function () {
      document.querySelectorAll('.drop.is-open').forEach(function (drop) {
        drop.classList.remove('is-open');
        var btn = drop.querySelector('button');
        if (btn) { btn.setAttribute('aria-expanded', 'false'); }
      });
    });

    /* ── Fonction utilitaire ─────────────────────────────────────── */
    function closeMenu() {
      mainNav.classList.remove('nav-open');
      burger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

  }); /* fin ready() */

})();
</script>
