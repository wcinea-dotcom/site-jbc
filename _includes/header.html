<script>
(function () {
  'use strict';

  function ready(fn) {
    if (document.readyState !== 'loading') { fn(); }
    else { document.addEventListener('DOMContentLoaded', fn); }
  }

  ready(function () {

    var burger  = document.getElementById('burger');
    var drawer  = document.querySelector('.drawer');
    var overlay = document.getElementById('drawer-overlay');

    if (!burger || !drawer) { return; }

    /* ── 1. Ouvrir / fermer le drawer ───────────────────────────── */
    burger.setAttribute('aria-expanded', 'false');

    burger.addEventListener('click', function (e) {
      e.stopPropagation();
      var isOpen = drawer.classList.toggle('open');
      burger.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
      if (overlay) {
        overlay.style.display = isOpen ? 'block' : 'none';
      }
    });

    /* ── 2. Fermer avec Échap ────────────────────────────────────── */
    document.addEventListener('keydown', function (e) {
      if ((e.key === 'Escape' || e.key === 'Esc') &&
           drawer.classList.contains('open')) {
        closeDrawer();
        burger.focus();
      }
    });

    /* ── 3. Fermer via overlay ───────────────────────────────────── */
    if (overlay) {
      overlay.addEventListener('click', closeDrawer);
    }

    /* ── 4. Dropdowns desktop (chevrons Accueil / Nature) ────────── */
    document.querySelectorAll('.drop').forEach(function (drop) {
      var btn = drop.querySelector('button');
      if (!btn) { return; }

      btn.setAttribute('aria-expanded', 'false');

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var isOpen = drop.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', String(isOpen));

        /* Fermer les autres dropdowns */
        document.querySelectorAll('.drop').forEach(function (other) {
          if (other !== drop) {
            other.classList.remove('is-open');
            var ob = other.querySelector('button');
            if (ob) { ob.setAttribute('aria-expanded', 'false'); }
          }
        });
      });
    });

    /* ── 5. Fermer dropdowns en cliquant ailleurs ────────────────── */
    document.addEventListener('click', function () {
      document.querySelectorAll('.drop.is-open').forEach(function (drop) {
        drop.classList.remove('is-open');
        var btn = drop.querySelector('button');
        if (btn) { btn.setAttribute('aria-expanded', 'false'); }
      });
    });

    /* ── 6. Sous-menus dans le drawer (mobile) ───────────────────── */
    document.querySelectorAll('.drawer-group button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var sub = btn.closest('.drawer-group')
                     .nextElementSibling;
        if (sub && sub.classList.contains('drawer-sub')) {
          sub.classList.toggle('open');
        }
      });
    });

    /* ── Fonction utilitaire ─────────────────────────────────────── */
    function closeDrawer() {
      drawer.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      if (overlay) { overlay.style.display = 'none'; }
    }

  });
})();
</script>
