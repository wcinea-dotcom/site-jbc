<style>
  /* =========================================

    background-color: #f4f6f4; /* Un gris-vert très clair et élégant */
    border-bottom: 1px solid #e2e8e2;
    font-size: 0.85rem;
    padding: 8px 0;
  }
  .top-tier-inner {
    display: flex;
    justify-content: flex-end; /* Aligne les liens à droite */
    align-items: center;
    gap: 30px;
  }
  .top-tier-links {
    display: flex;
    gap: 25px;
  }
  .top-tier-links a {
    color: #4b5e46; /* Vert foncé du Jardin */
    font-weight: 700;
    transition: 0.2s ease;
    text-decoration: none;
  }
  .top-tier-links a:hover {
    color: #C5A059; /* Doré au survol */
  }
  .top-tier-tools {
    display: flex;
    align-items: center;
    gap: 20px;
    border-left: 1px solid #ccc;
    padding-left: 20px;
  }
  .tool-item {
    color: #1f2a33;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* =========================================
     2. BARRE PRINCIPALE (MAIN TIER)
     ========================================= */
  .main-tier {
    background: #ffffff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    position: sticky;
    top: 0;
    z-index: 2000;
  }
  .main-tier-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 90px;
  }
  .brand img {
    height: 75px; /* Taille optimale pour le logo */
    width: auto;
  }
  .main-nav {
    display: flex;
    gap: 35px;
    align-items: center;
  }
  .main-nav > a, .main-nav .nav-btn {
    font-family: 'Lato', sans-serif;
    font-weight: 900;
    font-size: 1.05rem; /* Un peu plus grand comme IUCN */
    color: #000; /* Noir profond */
    text-transform: capitalize; /* "Santé de la Nature" au lieu de "SANTÉ DE LA NATURE" */

    border: none;
    cursor: pointer;
    display: flex;

    gap: 6px;
    padding: 10px 0;
    transition: 0.2s;
  }
  .main-nav > a:hover, .main-nav .nav-btn:hover {
    color: #5E8F3A; /* Vert botanique au survol */
  }

  /* Dropdowns */
  .drop { position: relative; }
  .drop .menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #fff;
    border-top: 4px solid #5E8F3A; /* Ligne verte pour le design */
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    min-width: 260px;
    z-index: 2500;
    padding: 10px 0;
  }
  .drop.open .menu { display: block; }
  .drop .menu a {
    display: block;
    padding: 12px 20px;
    color: #333;
    font-weight: 700;
    border-bottom: 1px solid #f0f0f0;
  }
  .drop .menu a:hover {
    background: #f4f6f4;
    color: #2F5D2F;
    padding-left: 25px; /* Animation de décalage */
  }

  /* =========================================
     3. BOUTON S'IMPLIQUER (Le jaune "Get Involved")
     ========================================= */
  .btn-get-involved {
    background-color: #f6c344; /* Le fameux jaune/doré IUCN */
    color: #000 !important;
    font-weight: 900;
    font-size: 1.05rem;
    padding: 15px 30px;
    border-radius: 4px; /* Forme rectangulaire sérieuse */
    text-transform: capitalize;
    transition: 0.3s;
    box-shadow: 0 4px 10px rgba(246, 195, 68, 0.3);
  }
  .btn-get-involved:hover {
    background-color: #e5b232;
    transform: translateY(-2px);
  }

  @media (max-width: 1050px) {
    .top-tier { display: none; } /* Cache la petite barre sur mobile */
    .main-nav { display: none; }
    .btn-get-involved { display: none; }
    .burger { display: flex; font-size: 1.5rem; border: none; background: none; cursor: pointer; }
  }
</style>

<div class="top-tier">
  <div class="container top-tier-inner">
    <div class="top-tier-links">
      <a href="{{ '/apropos.html' | relative_url }}">À propos</a>
      <a href="{{ '/medias.html' | relative_url }}">Actualités & Événements</a>
      <a href="{{ '/medias.html' | relative_url }}">Presse</a>

      <a href="{{ '/donnees.html' | relative_url }}" style="color: #C5A059;">Données & Ressources</a>
    </div>
    
    <div class="top-tier-tools">
      <div class="tool-item" id="btnSearchTop">
        Rechercher <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <div class="tool-item">
        Français <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
      </div>
    </div>
  </div>
</div>

<header class="main-tier">
  <div class="container main-tier-inner">
    
    <a href="{{ '/' | relative_url }}" class="brand">
      <img src="{{ 'images/logo/logo-jardin-botanique-des-cayes.png' | relative_url }}" alt="Logo JBC">
    </a>

    <nav class="main-nav">
      <a href="{{ '/' | relative_url }}">Accueil</a>
      
      <a href="{{ '/sante-humaine.html' | relative_url }}">Santé Humaine</a>

      <div class="drop" id="dropNature">
        <button class="nav-btn" id="btnNature">Santé de la Nature <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i></button>
        <div class="menu">
          <a href="{{ '/science.html' | relative_url }}">Sciences</a>
          <a href="{{ '/donnees.html' | relative_url }}">Données</a>
          <a href="{{ '/conservation.html' | relative_url }}">Conservation</a>
          <a href="{{ '/recherche.html' | relative_url }}">Horticulture & Restauration</a>

      </div>

    <div class="main-actions">
      <a href="{{ '/impliquer.html' | relative_url }}" class="btn-get-involved">S'impliquer</a>
      <button class="burger" id="burger" style="display: none;"><i class="fa-solid fa-bars"></i></button>
    </div>

  </div>
</header>

<script>
  // Script pour ouvrir le Dropdown Santé de la Nature
  const btnNature = document.getElementById('btnNature');
  const dropNature = document.getElementById('dropNature');
  
  if (btnNature && dropNature) {
    btnNature.addEventListener('click', (e) => {
      e.stopPropagation();
      dropNature.classList.toggle('open');
    });
  }

  // Fermer quand on clique ailleurs
  document.addEventListener('click', () => {
    if (dropNature) dropNature.classList.remove('open');
  });
</script>
