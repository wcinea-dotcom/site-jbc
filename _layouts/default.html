<!-- =========================
     _layouts/default.html
     (corrigé: inclut bien le header + meta description SEO + assets en relative_url)
     ========================= -->
<!doctype html>
<html lang="{{ page.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title }} | {% endif %}Jardin Botanique des Cayes
  </title>

  <meta name="description" content="{{ page.description | default: site.description | default: 'Jardin Botanique des Cayes — science, conservation, éducation et données pour la biodiversité en Haïti.' }}">

  <link rel="stylesheet" href="{{ 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ 'assets/css/site.css' | relative_url }}">

  {% if page.url %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% endif %}
</head>

<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ 'assets/site.js' | relative_url }}"></script>
</body>
</html>
