<style>
  /* Correction de la taille du bouton Devenir Membre */
  .btn-member {
    background: var(--header-btn-green);
    color: #fff;
    border-radius: 25px;
    padding: 8px 18px; /* Plus petit */
    font-weight: 700;
    font-size: 0.8rem; /* Plus compact */
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.3s;
  }
  .btn-member:hover { background: var(--botanical); transform: translateY(-2px); }

  /* Style du champ de recherche */
  #searchInput.active { display: inline-block !important; width: 150px; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { width: 0; opacity: 0; } to { width: 150px; opacity: 1; } }
</style>

<script>
  (function(){
    // Fonction universelle pour les dropdowns
    function setupDrop(btnId, dropId) {
      const btn = document.getElementById(btnId);
      const drop = document.getElementById(dropId);
      if(btn && drop) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Ferme les autres menus ouverts
          document.querySelectorAll('.drop').forEach(d => { if(d !== drop) d.classList.remove('open'); });
          drop.classList.toggle('open');
        });
      }
    }

    setupDrop('btnAccueil', 'dropAccueil');
    setupDrop('btnNature', 'dropNature');

    // Gestion de la Recherche
    const btnSearch = document.getElementById('btnSearch');
    const searchInput = document.getElementById('searchInput');
    if(btnSearch && searchInput) {
      btnSearch.addEventListener('click', (e) => {
        e.stopPropagation();
        searchInput.classList.toggle('active');
        if(searchInput.classList.contains('active')) searchInput.focus();
      });
    }

    // Fermer tout si on clique ailleurs
    document.addEventListener('click', () => {
      document.querySelectorAll('.drop').forEach(d => d.classList.remove('open'));
      if(searchInput) searchInput.classList.remove('active');
    });
  })();
</script>
