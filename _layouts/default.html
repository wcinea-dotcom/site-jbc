<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Jardin Botanique des Cayes</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* --- VARIABLES ET STYLES DE BASE --- */
    :root {
      --deep: #2F5D2F;
      --botanical: #5E8F3A;
      --gold: #C5A059;
      --paper: #FBFCFA;
      --ink: #1f2a33;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Lato", sans-serif; color: var(--ink); background: var(--paper); line-height: 1.6; }
    h1, h2, h3 { font-family: "Playfair Display", serif; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 22px; }

    /* --- HEADER & NAVIGATION --- */
    .topbar { background: #fff; height: 104px; border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 2000; }
    .topbar-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .brand img { height: 80px; width: auto; }
    .nav { display: flex; align-items: center; gap: 20px; }
    .nav a, .nav-btn { font-weight: 900; font-size: 0.85rem; text-transform: uppercase; cursor: pointer; background: none; border: none; }

    /* --- DROPDOWNS --- */
    .drop { position: relative; }
    .drop .menu { 
      display: none; 
      position: absolute; 
      top: 100%; 
      left: 0; 
      background: #fff; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
      border-radius: 12px; 
      min-width: 220px; 
      z-index: 3000;
      padding: 10px 0;
    }
    .drop.open .menu { display: block; }
    .drop .menu a { display: block; padding: 10px 20px; color: #1f2a33; font-weight: 500; border-bottom: 1px solid #f5f5f5; text-transform: none; }
    .drop .menu a:last-child { border-bottom: none; }

    /* --- RECHERCHE --- */
    .search-wrap { display: flex; align-items: center; position: relative; }
    #searchInput { 
      width: 0; opacity: 0; transition: 0.3s; border-radius: 20px; border: 1px solid #ddd; padding: 0;
    }
    #searchInput.active { width: 180px; opacity: 1; padding: 6px 15px; margin-right: 8px; }
    .btn-search { background: var(--gold); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    /* --- BOUTON MEMBRE --- */
    .btn-member { background: #4b5e46; color: #fff; padding: 8px 18px; border-radius: 25px; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
  </style>
</head>
<body>

  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <script>
    // 1. Gestion des menus déroulants (Dropdowns)
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const parent = btn.parentElement;
        // Ferme les autres menus ouverts
        document.querySelectorAll('.drop').forEach(d => { if(d !== parent) d.classList.remove('open'); });
        parent.classList.toggle('open');
      });
    });

    // 2. Gestion de la barre de recherche
    const btnSearch = document.getElementById('btnSearch');
    const searchInput = document.getElementById('searchInput');
    if(btnSearch) {
      btnSearch.addEventListener('click', (e) => {
        e.stopPropagation();
        searchInput.classList.toggle('active');
        if(searchInput.classList.contains('active')) searchInput.focus();
      });
    }

    // 3. Fermer tout si on clique n'importe où ailleurs sur la page
    document.addEventListener('click', () => {
      document.querySelectorAll('.drop').forEach(d => d.classList.remove('open'));
      if(searchInput) searchInput.classList.remove('active');
    });
  </script>

</body>
</html>
