<!-- =========================
     _layouts/default.html
     (corrigé: inclut bien le header + meta description SEO + assets en relative_url)
     ========================= -->
<!doctype html>
<html lang="{{ page.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title }} | {% endif %}Jardin Botanique des Cayes
  </title>

  <meta name="description" content="{{ page.description | default: site.description | default: 'Jardin Botanique des Cayes — science, conservation, éducation et données pour la biodiversité en Haïti.' }}">

  {% assign og_img = page.image | default: site.og_image | default: '/images/index/index-hero.png' | absolute_url %}

  <!-- Open Graph / Réseaux sociaux -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jardin Botanique des Cayes">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Jardin Botanique des Cayes">
  <meta property="og:description" content="{{ page.description | default: site.description | default: 'Jardin Botanique des Cayes — science, conservation, éducation et données pour la biodiversité en Haïti.' }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ og_img }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}Jardin Botanique des Cayes">
  <meta name="twitter:description" content="{{ page.description | default: site.description | default: 'Jardin Botanique des Cayes — science, conservation, éducation et données pour la biodiversité en Haïti.' }}">
  <meta name="twitter:image" content="{{ og_img }}">

  <link rel="stylesheet" href="{{ 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ 'assets/css/site.css' | relative_url }}">

  {% if page.url %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% endif %}
</head>

<body>
  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <script src="{{ 'assets/site.js' | relative_url }}"></script>
</body>
</html>
