<!doctype html>
<html lang="{{ page.lang | default: 'fr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Jardin Botanique des Cayes</title>

  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">

  <meta property="og:title" content="{{ page.title }} | Jardin Botanique des Cayes" />
  <meta property="og:image" content="{{ '/images/index/index-hero.jpg' | relative_url }}" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

  <!-- CSS global existant (si tu l’utilises déjà) -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <!-- CSS du header -->
  <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}">

  <style>
    :root{
      --deep:#2F5D2F;
      --botanical:#5E8F3A;
      --gold:#C5A059;
      --paper:#FBFCFA;
      --ink:#1f2a33;

      --hdr-deep: var(--deep);
      --hdr-gold: var(--gold);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:"Lato",sans-serif; color:var(--ink); background:var(--paper); line-height:1.6; }
    h1,h2,h3{ font-family:"Playfair Display",serif; }
    a{ text-decoration:none; color:inherit; }
    .container{ max-width:1200px; margin:0 auto; padding:0 22px; }
  </style>
</head>

<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- JS du header (dropdown + burger) -->
  <script src="{{ '/assets/js/header.js' | relative_url }}"></script>
</body>
</html>
