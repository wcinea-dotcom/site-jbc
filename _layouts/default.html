<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | Jardin Botanique des Cayes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />
  
  <style>
    /* --- COULEURS ET DESIGN GLOBAL --- */
    :root{ --deep:#2F5D2F; --botanical:#5E8F3A; --gold:#C5A059; --header-btn-green: #4b5e46; --footer-bg: #4b5e46; --paper:#FBFCFA; --ink:#1f2a33; --navH:104px; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{ font-family:"Lato",sans-serif; color:var(--ink); background:var(--paper); line-height:1.6; }
    h1,h2,h3{font-family:"Playfair Display",serif}
    a{color:inherit;text-decoration:none}
    img{max-width:100%; display:block;}
    .container{max-width:1200px; margin:0 auto; padding:0 22px}

    /* --- HEADER --- */
    .topbar{position:sticky; top:0; z-index:2000; background:#fff; border-bottom:1px solid rgba(0,0,0,.05); height:var(--navH);}
    .topbar-inner{height:100%; display:flex; align-items:center; justify-content:space-between; gap:16px;}
    .brand img{height:92px; width:auto;}
    .nav{display:flex; align-items:center; gap:24px; justify-content:center; flex:1}
    .nav a, .nav button{font-weight:900; font-size:.86rem; color:rgba(18,24,30,.92); padding:10px 6px; text-transform:uppercase; background:transparent; border:none; cursor:pointer;}
    .nav a:hover, .nav button:hover{color:var(--deep);}
    .nav-group{display:flex; align-items:center; gap:4px;}
    .drop{position:relative;}
    .drop .menu{display:none; position:absolute; top:calc(100% + 10px); left:0; min-width:240px; background:#fff; border-radius:16px; box-shadow:0 18px 60px rgba(0,0,0,.16); z-index:2500;}
    .drop.open .menu{display:block;}
    .drop .menu a{display:block; padding:12px 14px; border-bottom:1px solid rgba(0,0,0,.06); text-transform:none;}
    .actions{display:flex; align-items:center; gap:10px;}
    .btn-search{width:44px; height:44px; border-radius:50%; background:var(--gold); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink: 0;}
    .btn-member{background:var(--header-btn-green); color:#fff; border-radius:30px; padding:12px 24px; font-weight:900; font-size:.85rem; text-transform:uppercase; display:inline-flex; align-items:center; gap:8px; white-space:nowrap;}
    .drawer{display:none;} 

    /* --- MISE EN PAGE DES ARTICLES DE BLOG --- */
    .post-container { max-width: 800px; margin: 60px auto; padding: 50px; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.05); }
    .post-title { font-size: 2.5rem; color: #1f2a33; margin-bottom: 15px; text-align: center; }
    .post-meta { color: var(--gold); font-weight: 900; text-transform: uppercase; font-size: 0.9rem; text-align: center; margin-bottom: 40px; }
    .post-content p { font-size: 1.15rem; color: rgba(31,42,51,.85); margin-bottom: 20px; line-height: 1.8; }
    .post-content img { border-radius: 14px; margin: 30px 0; }
    .post-content h3 { font-size: 1.6rem; margin: 30px 0 15px; color: #4b5e46; }

    /* --- FOOTER --- */
    footer{background:var(--footer-bg); color:#fff; padding:60px 0 20px; margin-top:60px;}
    .footer-grid{display:grid; grid-template-columns: 1fr 1fr 1fr; gap:40px; align-items:start}
    .footer-title{color:var(--gold); font-weight:900; font-size:1rem; margin-bottom:20px; text-transform:uppercase;}
    .footer-list{list-style:none;}
    .footer-list li{margin:16px 0}
    .footer-list a{color:#fff; transition:0.2s;}
    .footer-list a:hover{color:var(--gold)}
    .social-icons{display:flex; gap:16px; flex-wrap:wrap;}
    .social-icons a{width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; color:#fff; transition:.2s ease;}
    .social-icons a:hover{background:var(--gold); border-color:var(--gold); color:#1f2a33;}
  </style>
</head>
<body>

  {% include header.html %}

  {% if page.layout == "post" %}
  <div class="container">
    <article class="post-container">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">{{ page.categorie_principale }} > {{ page.sous_categorie }}</div>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </div>
  {% else %}
    {{ content }}
  {% endif %}

  {% include footer.html %}

</body>
</html>
