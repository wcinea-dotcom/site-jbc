<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'fr' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% if page.title %}{{ page.title }} | {% endif %}Jardin Botanique des Cayes</title>

  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% endif %}

  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.og_title %}{{ page.og_title }}{% else %}Jardin Botanique des Cayes{% endif %}">
  <meta property="og:description" content="{% if page.og_description %}{{ page.og_description }}{% else %}Biodiversité, science, conservation et éducation au service de la nature et de l’homme.{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{% if page.og_image %}{{ page.og_image | relative_url | absolute_url }}{% else %}{{ 'images/index/index-hero.jpg' | relative_url | absolute_url }}{% endif %}">

  <!-- Fonts + Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />

  <!-- CSS global (IMPORTANT) -->
  <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}">

  <!-- CSS spécifique page (optionnel) -->
  {% if page.page_css %}
  <link rel="stylesheet" href="{{ page.page_css | relative_url }}">
  {% endif %}

  <!-- Extra head (optionnel) -->
  {% if page.head_extra %}{{ page.head_extra }}{% endif %}
</head>

<body>
  {% include header.html %}
  {% include drawer.html %}

  {{ content }}

  {% include footer.html %}

  <!-- JS global (IMPORTANT) -->
  <script src="{{ '/assets/js/header.js' | relative_url }}" defer></script>

  {% if page.body_extra %}{{ page.body_extra }}{% endif %}
</body>
</html>
