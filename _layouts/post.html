---
layout: default
---

<style>
  /* Le design automatique de vos articles de blog */
  .blog-post-container { padding: 40px 20px 80px; }
  .post-header { text-align: center; max-width: 900px; margin: 0 auto 40px; }
  
  .post-category { color: #5E8F3A; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; font-size: 0.9rem; margin-bottom: 15px; display: block;}
  .post-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 4vw, 3.5rem); color: #2F5D2F; margin-bottom: 15px; line-height: 1.2; }
  .post-subtitle { font-size: 1.3rem; color: #555; font-style: italic; margin-bottom: 25px; line-height: 1.5; }
  .post-meta { font-size: 0.95rem; color: #888; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; display: inline-block; }
  .post-meta strong { color: #1f2a33; }

  .post-cover-wrapper { max-width: 1000px; margin: 0 auto 50px; }
  .post-cover-img { width: 100%; max-height: 550px; object-fit: cover; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }

  /* La zone de lecture */
  .post-content { max-width: 750px; margin: 0 auto; font-size: 1.15rem; line-height: 1.8; color: #333; }
  
  /* Style automatique pour les sous-titres que vous mettrez dans le texte */
  .post-content h2 { font-family: 'Playfair Display', serif; color: #2F5D2F; font-size: 2rem; margin: 50px 0 20px; }
  .post-content h3 { color: #5E8F3A; font-size: 1.4rem; margin: 30px 0 15px; }
  
  /* Style automatique pour les photos dans le texte */
  .post-content img { width: 100%; border-radius: 8px; margin: 40px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
  
  /* Style pour les citations */
  .post-content blockquote { border-left: 5px solid #C5A059; padding-left: 20px; margin: 30px 0; font-style: italic; font-size: 1.25rem; color: #555; background: #fdfcf9; padding: 20px; border-radius: 0 8px 8px 0;}

  /* Style pour les références à la fin */
  .post-references { margin-top: 60px; padding-top: 30px; border-top: 2px solid #eee; font-size: 0.95rem; color: #666; }
  .post-references h4 { color: #2F5D2F; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; margin-bottom: 15px; }
</style>

<article class="blog-post-container">
  
  <header class="post-header">
    <span class="post-category">{{ page.category }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
    
    {% if page.subtitle %}
      <p class="post-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    
    <div class="post-meta">
      Rédigé par <strong>{{ page.author }}</strong> | Publié le {{ page.date | date: "%d/%m/%Y" }}
    </div>
  </header>

  {% if page.image %}
  <div class="post-cover-wrapper">
    <img src="{{ page.image | relative_url }}" alt="Couverture de l'article" class="post-cover-img">
  </div>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
