# =========================================================
#  _config.yml — Jardin Botanique des Cayes
# =========================================================

title:       "Jardin Botanique des Cayes"
description: "Données, science, éducation et actions concrètes au service de la biodiversité en Haïti."
url:         "https://wcinea-dotcom.github.io"
baseurl:     "/site-jbc"
author:      "Jardin Botanique des Cayes"
og_image:    "/images/index/index-hero.jpg"

# Langues supportées : fr / en / ht (Kreyòl ayisyen)
languages:   ["fr", "en", "ht"]

# Build
markdown: kramdown
permalink: pretty

# Exclusions (ne pas publier les fichiers de dev)
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.DS_Store"
  - "**/.DS_Store"
  - README.md
  - vendor/

# Defaults par dossier/langue
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      lang: "fr"

  - scope:
      path: "en"
      type: "pages"
    values:
      lang: "en"

  - scope:
      path: "ht"
      type: "pages"
    values:
      lang: "ht"
